services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
      DATABASE_URL: postgres://trail:trail_local@db:5432/trail?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: trail
      POSTGRES_PASSWORD: trail_local
      POSTGRES_DB: trail
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trail -d trail"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
