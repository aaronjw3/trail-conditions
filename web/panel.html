<div class="section-head"><h2>{{.Name}}</h2><button hx-post="/routes/{{.ID}}/refresh" hx-indicator="#loading" hx-disabled-elt="this" class="text-button">Refresh forecast</button></div>
<form hx-get="/routes/{{.ID}}/panel" hx-trigger="change" hx-sync="this:replace">
<label for="hour">{{.Time}}</label>
<input type="range" id="hour" name="hour" min="0" max="{{.MaxHour}}" value="{{.Hour}}">
<label for="metric">Map color</label>
<select id="metric" name="metric">
<option value="temperature" {{if eq .Metric "temperature"}}selected{{end}}>Temperature · °C</option>
<option value="precipitation" {{if eq .Metric "precipitation"}}selected{{end}}>Precipitation · mm / hour</option>
<option value="wind" {{if eq .Metric "wind"}}selected{{end}}>Wind speed · km/h</option>
</select>
</form>
<div class="legend"><span id="low"></span><div id="gradient"></div><span id="high"></span></div>
<p class="fine">Retrieved {{.Retrieved}} · {{.ForecastHours}} hourly forecasts · Forecast times shown in UTC</p>
<div class="section-head"><h2>Forecast locations</h2><span class="fine">Select a sample to locate it on the map</span></div>
<p class="fine">Up to 12 sampled locations. Polygon forecasts sample the exterior boundary, not the whole area.</p>
<div id="readings">{{range .Rows}}
<button class="sample" data-longitude="{{index .Point 0}}" data-latitude="{{index .Point 1}}">
<span class="number">SAMPLE {{.Index}}</span>
<strong>{{printf "%.1f" .Temperature}}°C</strong>
<small>{{printf "%.1f" .Precipitation}} mm / hour precipitation</small>
<small>{{printf "%.1f" .Wind}} km/h wind</small>
</button>{{end}}</div>
<div id="map-data" hidden>{{.Data}}</div>
