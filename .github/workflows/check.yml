name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
      - run: go build ./...
      - run: node --check --input-type=module < web/app.js
      - run: node --test map.test.cjs
      - run: docker build -t trail-conditions .
