name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: trail
          POSTGRES_PASSWORD: trail_test
          POSTGRES_DB: trail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trail -d trail_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://trail:trail_test@127.0.0.1:5432/trail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Analyze Go code
        run: go vet -tags=integration ./...
      - name: Run Go tests with PostgreSQL
        run: go test -race -count=1 -tags=integration -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Report coverage
        run: go tool cover -func=coverage.out
      - name: Build Go packages
        run: go build ./...
      - name: Check JavaScript syntax
        run: |
          node --check --input-type=module < web/app.js
          node --check --input-type=module < web/uploads.js
      - name: Test browser behavior
        run: node --test tests/web/*.test.cjs
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container
        run: docker build -t trail-conditions .
