name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: trail
          POSTGRES_PASSWORD: trail_test
          POSTGRES_DB: trail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trail -d trail_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://trail:trail_test@127.0.0.1:5432/trail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
      - run: go build ./...
      - run: node --check --input-type=module < web/app.js
      - run: node --test map.test.cjs
      - run: docker compose config --quiet
      - run: docker build -t trail-conditions .
